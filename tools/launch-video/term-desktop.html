<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;height:100%;background:#0f1320;color:#e9ecf5;font:22px/1.6 'IBM Plex Mono','DejaVu Sans Mono',ui-monospace,monospace}
.wrap{padding:48px 56px;max-width:1500px}.p{color:#8c96ad}.ok{color:#46c585}.y{color:#f0a640}.b{color:#4cb8e6}.cur::after{content:'▍';animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:36px;max-width:70%;background:rgba(0,0,0,.72);color:#fff;font:500 22px/1.35 'IBM Plex Sans',system-ui,sans-serif;padding:10px 18px;border-radius:8px;text-align:center;display:none;border:1px solid #2a3147}#cap.on{display:block}
</style></head><body><div class="wrap" id="t"></div><div id="cap"></div>
<script>
const lines = {
bench: [
 ['p','$ node demo/bench.js'],['','ms: 305.4'],['p','$ git merge ambiflex/n19-track-shaped-rows'],['','Updating 0353a29..6b5b1e5'],['p','$ BASELINE_MS=334 node demo/bench.js'],['','ms: 44.0'],['ok','SCORE: 7.38']],
auto: [
 ['b','[tree] Auto mode, turn 14/40. Work on n7 "Tree search" (Range, estimate 3d).'],['p','Set it exploring, do the work, verify it with an external judge, then tree_upsert it done with its verification. Stop the turn when this node is settled; I will hand you the next one.'],['',''],['y','Auto mode ON. 12 nodes to go. ETA end to end: 5w on the critical path (n10 → n13).'],['y','Estimated cost: $301.80 at $20.28/h (measured). Stops after 40 turns, on your interruption, on the budget, or with /ambiflex stop.']],
install: [['p','$ claude plugin install ambiflex@imade'],['ok','√ Successfully installed plugin: ambiflex@imade (scope: user)'],['',''],['b','/plugin install ambiflex --marketplace ImadeBenToumAI/ImadeBenToumAI']]
};
window.show = async (k, delay = 350) => { const t = document.getElementById('t'); t.innerHTML = ''; for (const [c, s] of lines[k]) { const d = document.createElement('div'); d.className = c; d.textContent = s; t.appendChild(d); await new Promise(r => setTimeout(r, s.startsWith('$') ? delay * 2 : delay)); } const cur = document.createElement('div'); cur.className = 'cur'; t.appendChild(cur); };
window.cap = (s) => { const c = document.getElementById('cap'); c.textContent = s; c.className = s ? 'on' : ''; };
</script></body></html>
